
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The head unit is a standalone ESP32 + GC9A01 round display project. It uses
; LVGL for the GUI widgets and LovyanGFX as the pixel driver (LovyanGFX ships
; a GC9A01 panel class, so no display driver code is written by hand).
;
; LVGL options are set in include/lv_conf.h, the path LVGL scans for its user
; configuration. That file is small: anything it omits falls back to LVGL's
; own defaults, so the versioned conf stays minimal and un-fragile.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	lvgl/lvgl
	lovyan03/LovyanGFX
	pu2clr/PU2CLR SI470X
; Pin ESPAsyncWebServer to the main-HEAD that fixes the >5.7KB response
	; truncation (PR #316). The registry release 3.12.0 predates the fix.
	https://github.com/ESP32Async/ESPAsyncWebServer.git#d009eff9ee94f92beccdf5812d89ec79aa44a6c1
	ESP32Async/AsyncTCP @ ^3.5.0
	bblanchon/ArduinoJson

build_flags =
	; Project headers must be reachable for the app sources AND for the LVGL
	; built-in LovyanGFX driver file (which pulls in our LGFX user header).
	-I include
	-I .pio/libdeps/${PIOENV}/LovyanGFX/src

board_build.filesystem = littlefs

; Grow the app flash to 3 MB (default ~1.3 MB overflows with the clock-face
; bitmap + radio web stack). See partitions.csv.
board_build.partitions = partitions.csv

; Head-unit validation build: same wiring, hands driven by fixed timestamps
; (HEADUNIT_TEST_MODE) so positions are checkable without a running clock.
[env:test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	lvgl/lvgl
	lovyan03/LovyanGFX
	pu2clr/PU2CLR SI470X
; Keep in sync with [env:esp32dev] - see comment there.
	https://github.com/ESP32Async/ESPAsyncWebServer.git#d009eff9ee94f92beccdf5812d89ec79aa44a6c1
	ESP32Async/AsyncTCP @ ^3.5.0
	bblanchon/ArduinoJson

build_flags =
	-I include
	-I .pio/libdeps/${PIOENV}/LovyanGFX/src
	-DHEADUNIT_TEST_MODE=1
board_build.partitions = partitions.csv