; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Custom partition table: no OTA, 3 MB app (vs default 2x1.25 MB OTA slots).
; Reclaims flash budget for ongoing features (issue #23). See partitions.csv.
board_build.partitions = partitions.csv
; Optional GPS per-sentence diagnosis ([GPS RAW]/[GPS GSV]/[GPS ERR]); OFF by
; default to keep flash/log lean. Enable with:  -D GPS_DEBUG_LOG
;   pio run -d motor-node -e esp32dev -D GPS_DEBUG_LOG
; build_flags =
;   -D GPS_DEBUG_LOG
; DIAGNOSTIC_GPS_NO_FIX.cpp is a standalone troubleshooting sketch (own
; comment: "swap in manually"), not part of the firmware: it references
; main.cpp's `gpsReceiver`, which has internal linkage (anonymous namespace)
; and is therefore invisible outside main.cpp. Left in src/'s default filter
; it fails the whole build with "'gpsReceiver' was not declared in this
; scope", so it must be excluded here.
build_src_filter = +<*> -<DIAGNOSTIC_GPS_NO_FIX.cpp>
lib_deps =
	h2zero/NimBLE-Arduino
	# Web UI for GPS + diagnostics. Pin ESPAsyncWebServer to the main-HEAD that
	# fixes >5.7KB response truncation (PR #316), same as headunit.
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	ESP32Async/AsyncTCP @ ^3.5.0
	bblanchon/ArduinoJson

; VehicleState has no Arduino/hardware dependency, so its OBD-conversion
; formulas can be unit-tested on the host instead of only on real hardware.
; TemperatureLookup is likewise hardware-free (pure table/interpolation/fault
; math); TemperatureSensor.cpp IS excluded here because it reads the ADC and
; needs the Arduino/ESP32 API, so it is only built for the esp32dev env.
[env:native]
platform = native
build_flags = -std=gnu++11
build_src_filter = -<*> +<VehicleState.cpp> +<TemperatureLookup.cpp>
test_framework = unity
