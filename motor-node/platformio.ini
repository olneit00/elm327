; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino
	# Web UI for GPS + diagnostics. Pin ESPAsyncWebServer to the main-HEAD that
	# fixes >5.7KB response truncation (PR #316), same as headunit.
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	ESP32Async/AsyncTCP @ ^3.5.0
	bblanchon/ArduinoJson

; VehicleState has no Arduino/hardware dependency, so its OBD-conversion
; formulas can be unit-tested on the host instead of only on real hardware.
[env:native]
platform = native
build_flags = -std=gnu++11
build_src_filter = -<*> +<VehicleState.cpp>
test_framework = unity
